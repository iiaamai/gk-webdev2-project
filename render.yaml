services:
  - type: web
    name: gk-trucking-web
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Manila
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_URL
        fromDatabase:
          name: gk-postgres
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: GK_MAPBOX_ENABLED
        value: "true"
      - key: MAPBOX_TOKEN
        sync: false
      - key: GK_MAIL_ENABLED
        value: "true"
      - key: MAIL_MAILER
        value: resend
      - key: MAIL_FROM_NAME
        value: GK Trucking Services
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false

databases:
  - name: gk-postgres
    databaseName: gk_trucking
    user: gk
    plan: free
    region: singapore
